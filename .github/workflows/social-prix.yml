# Les posts qui montrent des prix (docs/social.md, "prices": true) sont redessinés chaque jour avec les prix du jour,
# la veille et le jour de leur publication. Les posts eux-mêmes vivent sur la branche social.
name: Posts sociaux, prix du jour

on:
  # dès que les prix du jour sont là : GitHub lance prices.yml des heures après son cron de 11 h UTC (18-20 h en octobre)
  workflow_run:
    workflows: ["Prix Cardmarket du jour"]
    types: [completed]
  schedule:
    # filet si prices.yml n'a pas tourné
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: social-render
  cancel-in-progress: false

jobs:
  prix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          path: app
      - uses: actions/checkout@v5
        with:
          ref: social
          path: social
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Installer
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm i --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Redessiner les posts à prix
        working-directory: app
        run: node scripts/social/render.mjs --social ../social --prices
      - name: Ranger les rendus
        working-directory: social
        run: |
          git config user.name "nookdex-bot"
          git config user.email "nookdex-bot@users.noreply.github.com"
          git add renders
          git diff --cached --quiet && exit 0
          git commit -qm "Posts : prix du jour"
          for try in 1 2 3; do
            git push && exit 0
            # the social branch moved meanwhile (a post pushed): on top of it; if both touched the same renders, draw them again on top
            git fetch -q origin social
            if ! git rebase -q origin/social; then
              git rebase --abort
              git reset -q --hard origin/social
              (cd ../app && node scripts/social/render.mjs --social ../social --prices)
              git add renders
              git diff --cached --quiet && exit 0
              git commit -qm "Posts : prix du jour"
            fi
          done
          exit 1
