# One-off: reads Cardmarket's help pages and Data downloads, compares them with our prices (scripts/cm-probe.mjs).
name: Sonde Cardmarket

on:
  push:
    branches: [claude/charming-heisenberg-25owj0]
    paths: [scripts/cm-probe.mjs, .github/workflows/cm-probe.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/cm-probe.mjs
