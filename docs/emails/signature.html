<!doctype html>
<!--
  Johan's Gmail signature (contact@ and johan@nookdex.com). Gmail's editor takes no HTML: open this file in Chrome,
  Ctrl+A, Ctrl+C, then paste in Gmail → Settings → General → Signature.
  The picture's column has a fixed width (width, min-width): on a phone Gmail squeezed the column and Warwick turned oval
  (his height stayed 72 px). The picture itself is square, public/email/warwick.png (144 px, shown at 72).
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Signature NookDex</title>
  </head>
  <body>
    <table cellpadding="0" cellspacing="0" border="0" role="presentation" style="color: #2b2230; border-collapse: collapse">
      <tbody>
        <tr>
          <td width="86" style="width: 86px; min-width: 86px; padding: 0 14px 0 0; vertical-align: middle">
            <a href="https://nookdex.com" style="text-decoration: none"
              ><img
                src="https://nookdex.com/email/warwick.png"
                width="72"
                height="72"
                alt="Warwick, le chat de NookDex"
                style="display: block; width: 72px; min-width: 72px; max-width: 72px; height: 72px; border: 0; border-radius: 36px"
            /></a>
          </td>
          <td style="padding: 0 0 0 14px; vertical-align: middle; border-left: 3px solid #b8433d">
            <div style="font-size: 15px; font-weight: bold; line-height: 20px">Johan</div>
            <div style="font-size: 13px; line-height: 18px; color: #6f6068">
              Créateur de <a href="https://nookdex.com" style="color: #b8433d; font-weight: bold; text-decoration: none">NookDex</a>
            </div>
            <div style="font-size: 13px; line-height: 18px; color: #6f6068; padding-top: 2px">Ta collection Pokémon TCG, rangée sur un bureau cosy</div>
            <div style="font-size: 13px; line-height: 20px; padding-top: 6px">
              <a href="https://nookdex.com" style="color: #a8701a; text-decoration: none; font-weight: bold">nookdex.com</a>
              <span style="color: #c9bca6"> · </span>
              <a href="https://www.instagram.com/_nookdex/" style="color: #a8701a; text-decoration: none">Instagram @_nookdex</a>
              <span style="color: #c9bca6"> · </span>
              <a href="mailto:contact@nookdex.com" style="color: #a8701a; text-decoration: none">contact@nookdex.com</a>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
